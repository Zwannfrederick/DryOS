[package]
name = "dry-kernel"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
publish = false

[workspace]

[[bin]]
name = "dry-kernel"
path = "src/main.rs"
test = false
bench = false

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 2
lto = true
codegen-units = 1
debug = true
