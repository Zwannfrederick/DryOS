[package]
name = "dry-userspace"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "user-hello"
path = "src/bin/user_hello.rs"

[[bin]]
name = "user-peer"
path = "src/bin/user_peer.rs"

[[bin]]
name = "dry-init"
path = "src/bin/dry_init.rs"

[[bin]]
name = "dry-echo"
path = "src/bin/dry_echo.rs"

[[bin]]
name = "dry-display"
path = "src/bin/dry_display.rs"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 2
lto = true
codegen-units = 1

[workspace]

