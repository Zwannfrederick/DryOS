# SPDX-License-Identifier: MIT OR Apache-2.0
# Standalone Reference PCI/Mock Driver Island powered by `dry-driver-sdk` (`dry-sdk-demo.elf`).

[workspace]

[package]
name = "dry-sdk-demo"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[[bin]]
name = "dry-sdk-demo"
path = "src/main.rs"

[dependencies]
dry-driver-sdk = { path = "../dry-driver-sdk" }
dry-userspace = { path = "../../userspace" }

[profile.dev]
panic = "abort"

[profile.release]
opt-level = 2
lto = false
codegen-units = 1
panic = "abort"
