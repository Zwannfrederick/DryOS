# SPDX-License-Identifier: GPL-2.0-or-later
# Standalone Driver Island package (`ADR-005` GPL isolation boundary):
# Links unmodified Linux v6.18 `drivers/gpu/drm/tiny/bochs.c` + `libdry-lx-compat` ONLY into `dry-lx-drm-bochs.elf`.

[workspace]

[package]
name = "dry-lx-drm-bochs"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"

[[bin]]
name = "dry-lx-drm-bochs"
path = "src/main.rs"

[dependencies]
dry-userspace = { path = "../../userspace" }

[profile.dev]
panic = "abort"

[profile.release]
opt-level = 2
lto = false
codegen-units = 1
panic = "abort"
